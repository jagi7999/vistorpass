/* ---------------- DB helpers (Turso HTTP pipeline API) ---------------- */
async function tursoExec(sql, args=[]) {
  const body = {
    requests: [
      { type:"execute", stmt: { sql, args: args.map(a => (a === null || a === undefined) ? { type:"null" } : { type: typeof a === "number" ? "integer" : "text", value: String(a) }) } },
      { type:"close" }
    ]
  };
  const res = await fetch(TURSO_URL, {
    method:"POST",
    headers:{ "Authorization":`Bearer ${TURSO_TOKEN}`, "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if(!res.ok){
    throw new Error(`Turso HTTP ${res.status}: ${JSON.stringify(data)}`);
  }
  const firstResult = data.results?.[0];
  if(firstResult?.type === "error"){
    throw new Error(`Turso error: ${firstResult.error?.message || JSON.stringify(firstResult)}`);
  }
  const result = firstResult?.response?.result;
  if(!result) return { columns: [], rows: [] };
  const cols = result.cols.map(c=>c.name);
  const rows = (result.rows||[]).map(r => {
    const obj = {};
    r.forEach((cell,i)=> obj[cols[i]] = cell.value);
    return obj;
  });
  return { columns: cols, rows };
}

function initials(name){
  if(!name) return "?";
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||"").join("");
}

function readAndResizeImage(file, maxSize=200){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else { if(h > maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- Licensing ---------------- */
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function pad2(n){ return String(n).padStart(2,"0"); }

function formatDateDMY(isoDate){
  if(!isoDate || isoDate.length < 10) return isoDate || "—";
  const [y,m,d] = isoDate.slice(0,10).split("-");
  if(!y || !m || !d) return isoDate;
  return `${d}-${m}-${y}`;
}

// All timestamps in this app are stored and read as LOCAL time strings
// ("YYYY-MM-DD HH:MM:SS", no timezone). Parsing a string in this format
// without a trailing Z/offset is treated as local time per the JS spec,
// which keeps display times matching the security guard's actual clock.
function nowIso(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}

function daysBetween(aIso, bIso){
  const ms = new Date(bIso.replace(" ","T")) - new Date(aIso.replace(" ","T"));
  return Math.floor(ms/86400000);
}

function addDaysIso(iso, days){
  const d = new Date(iso.replace(" ","T"));
  d.setDate(d.getDate()+days);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}

async function ensureLicenseState(){
  let { rows } = await tursoExec(`SELECT * FROM app_license_state WHERE id=1`);
  if(!rows.length){
    await tursoExec(`INSERT INTO app_license_state (id, first_run_at, trial_days, status) VALUES (1, ?, 7, 'trial')`, [nowIso()]);
    rows = (await tursoExec(`SELECT * FROM app_license_state WHERE id=1`)).rows;
  }
  const state = rows[0];
  let status = state.status;
  let daysLeft = null;

  if(status === "licensed" && state.license_expires_at){
    if(daysBetween(nowIso(), state.license_expires_at) < 0){
      status = "expired";
      await tursoExec(`UPDATE app_license_state SET status='expired' WHERE id=1`);
    } else {
      daysLeft = daysBetween(nowIso(), state.license_expires_at);
    }
  } else if(status === "trial"){
    const elapsed = daysBetween(state.first_run_at, nowIso());
    daysLeft = parseInt(state.trial_days||7) - elapsed;
    if(daysLeft <= 0){
      status = "expired";
      await tursoExec(`UPDATE app_license_state SET status='expired' WHERE id=1`);
    }
  }
  return { status, daysLeft, licenseExpiresAt: state.license_expires_at, raw: state };
}

async function activateLicenseKey(rawKey){
  const key = (rawKey||"").replace(/\D/g,"");
  if(key.length !== 16) return { ok:false, msg:"Key must be exactly 16 digits" };
  const { rows } = await tursoExec(`SELECT * FROM license_keys WHERE license_key=?`, [key]);
  if(!rows.length) return { ok:false, msg:"Invalid key — not found" };
  const k = rows[0];
  if(k.status === "active") return { ok:false, msg:"This key has already been used" };
  if(k.status === "revoked") return { ok:false, msg:"This key has been revoked" };
  const now = nowIso();
  const expiresAt = addDaysIso(now, parseInt(k.duration_days));
  await tursoExec(`UPDATE license_keys SET status='active', activated_at=?, expires_at=? WHERE license_key=?`, [now, expiresAt, key]);
  await tursoExec(`UPDATE app_license_state SET status='licensed', activated_key=?, activated_at=?, license_expires_at=? WHERE id=1`, [key, now, expiresAt]);
  return { ok:true, expiresAt };
}

function generateRandomKey16(){
  const arr = new Uint32Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(n => (n % 10).toString()).join("");
}

async function issueLicenseKey(durationLabel){
  const dur = LICENSE_DURATIONS[durationLabel];
  if(!dur) throw new Error("Unknown duration");
  let key;
  for(let i=0;i<6;i++){
    key = generateRandomKey16();
    const { rows } = await tursoExec(`SELECT id FROM license_keys WHERE license_key=?`, [key]);
    if(!rows.length) break;
  }
  await tursoExec(
    `INSERT INTO license_keys (license_key, duration_label, duration_days, status, issued_at) VALUES (?,?,?,?,?)`,
    [key, dur.label, dur.days, "unused", nowIso()]
  );
  return key;
}

function formatKey(key){
  return key.replace(/(\d{4})(?=\d)/g, "$1-");
}

/* ---------------- Guest passcodes ---------------- */
function addHoursIso(iso, hours){
  const d = new Date(iso.replace(" ","T"));
  d.setTime(d.getTime() + hours*3600000);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}
function randomCode6(){
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return String(arr[0] % 1000000).padStart(6,"0");
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDateTime(iso){
  return iso ? `${formatDateDMY(iso)} ${iso.slice(11,16)}` : "—";
}
async function createGuestPasscode(block, flat, guestName, purpose, hours, createdBy){
  const now = nowIso();
  let code = null;
  for(let i=0;i<10;i++){
    const c = randomCode6();
    const { rows } = await tursoExec(
      `SELECT id FROM guest_passcodes WHERE code=? AND status='active' AND expires_at > ?`, [c, now]);
    if(!rows.length){ code = c; break; }
  }
  if(!code) throw new Error("Could not generate a unique code — try again");
  const expires = addHoursIso(now, hours);
  await tursoExec(
    `INSERT INTO guest_passcodes (block, flat_no, code, guest_name, purpose, created_by, created_at, expires_at, status)
     VALUES (?,?,?,?,?,?,?,?,'active')`,
    [block, flat, code, guestName, purpose, createdBy, now, expires]);
  return { code, expires };
}
async function findActivePasscode(code){
  const { rows } = await tursoExec(
    `SELECT * FROM guest_passcodes WHERE code=? AND status='active' AND expires_at > ? ORDER BY id DESC LIMIT 1`,
    [code, nowIso()]);
  return rows[0] || null;
}

async function autoCleanOldVisitors(){
  let days = 7;
  try{
    const v = parseInt(await getSetting("retention_days", "7"));

  }catch(e){}
  try{
    if(days > 0){
      await tursoExec(`DELETE FROM visitors WHERE created_at < ?`, [addDaysIso(nowIso(), -days)]);
    }
    // passcodes expired for more than 2 days are always purged
    await tursoExec(`DELETE FROM guest_passcodes WHERE expires_at < ?`, [addDaysIso(nowIso(), -2)]);
  }catch(e){ console.error("Auto-clean failed:", e); }
}

      lastLookedUp = digits;

              selectedType = match.id;
              grid.querySelectorAll(".type-chip").forEach(c=>c.classList.remove("selected"));

            }
            toast("Details filled from last visit");
          };
        } else {
          hintBox.innerHTML = "";
        }
      }catch(e){ console.error(e); }
    } else if(digits.length < 10){
      hintBox.innerHTML = "";
      lastLookedUp = "";
    }
  });

  return wrap;
}

async function onSubmitEntry(){
  const name = document.getElementById("f_name").value.trim();
  const phone = document.getElementById("f_phone").value.trim();
  const vehicle = formatPlateTyped(document.getElementById("f_vehicle").value.trim());
  const block = document.getElementById("f_block").value;
  const flat = document.getElementById("f_flat").value.trim();
  const purpose = document.getElementById("f_purpose").value.trim();

  if(!name){ toast("Enter visitor name"); return; }
  if(!flat){ toast("Enter flat number"); return; }
  if(!selectedType){ toast("Select visitor type"); return; }
  if(phone && phone.length !== 10){ toast("Phone number must be exactly 10 digits"); return; }

  const typeLabel = VISITOR_TYPES.find(t=>t.id===selectedType).label;
  const typeIcon = VISITOR_TYPES.find(t=>t.id===selectedType).ic;

  await tursoExec(
    `INSERT INTO visitors (visitor_name, phone, vehicle_no, visitor_type, block, flat_no, purpose, status, created_by, created_at, visitor_photo)
     VALUES (?,?,?,?,?,?,?,?,?,?,?)`,
    [name, phone, vehicle, typeLabel, block, flat, purpose, "pending", "security", nowIso(), capturedVisitorPhoto]
  );

  // look up member phone if not entered
  let waPhone = phone;
  if(!waPhone){
    const { rows } = await tursoExec(`SELECT phone FROM flat_members WHERE block=? AND flat_no=? LIMIT 1`, [block, flat]);
    waPhone = rows[0]?.phone || "";
  }

  toast("Visitor logged — pending approval");
  selectedType = null;
  capturedVisitorPhoto = null;

  // open WhatsApp compose to the flat member if we have a member phone on file
  const { rows: memberRows } = await tursoExec(`SELECT phone, member_name FROM flat_members WHERE block=? AND flat_no=? LIMIT 1`, [block, flat]);
  const member = memberRows[0];
  if(member?.phone){
    const lines = [
      `*Gate Alert* - Flat ${block}-${flat}`,
      ``,
      `Visitor type: ${typeLabel}`,
      `Name: ${name}`,
    ];
    if(vehicle) lines.push(`Vehicle: ${vehicle}`);
    if(purpose) lines.push(`Note: ${purpose}`);
    lines.push(``, `Block ${block} - Flat ${flat}`, ``, `Open the Gate Register app to approve or reject entry.`);
    const msg = encodeURIComponent(lines.join("\n"));
    window.open(`https://wa.me/91${member.phone.replace(/\D/g,"").slice(-10)}?text=${msg}`, "_blank");
  }

  await refreshVisitors();
  activeTab = "pending";
  renderRoleBar();
  renderTabs();
  render();
}

function sortByNewest(list){
  return [...list].sort((a,b) => (b.created_at||"").localeCompare(a.created_at||""));
}

/* ---------------- History ---------------- */
function localDateStr(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

function dateRangeForPreset(preset){
  const today = new Date();
  today.setHours(0,0,0,0);
  if(preset === "today"){
    return { from: localDateStr(today), to: localDateStr(today) };
  }
  if(preset === "yesterday"){
    const y = new Date(today); y.setDate(y.getDate()-1);
    return { from: localDateStr(y), to: localDateStr(y) };
  }
  if(preset === "week"){
    const start = new Date(today); start.setDate(start.getDate() - start.getDay());
    return { from: localDateStr(start), to: localDateStr(today) };
  }
  if(preset === "month"){
    const start = new Date(today.getFullYear(), today.getMonth(), 1);
    return { from: localDateStr(start), to: localDateStr(today) };
  }
  return null; // all time / custom handled separately
}

      <option value="">All status</option>

  dateBar.className = "filters";
  dateBar.innerHTML = `
    <select id="histPreset">
      <option value="all">All time</option>
      <option value="today">Today</option>
      <option value="yesterday">Yesterday</option>
      <option value="week">This week</option>
      <option value="month">This month</option>
      <option value="custom">Custom range</option>
    </select>
  `;
  wrap.appendChild(dateBar);

  const customRange = document.createElement("div");
  customRange.className = "row2";
  customRange.style.cssText = "display:none;margin-bottom:12px;";
  customRange.innerHTML = `
    <div class="field"><label>From</label><input type="date" id="histFrom"></div>
    <div class="field"><label>To</label><input type="date" id="histTo"></div>
  `;
  wrap.appendChild(customRange);

  const listBox = document.createElement("div");
  wrap.appendChild(listBox);

  const pagBox = document.createElement("div");
  wrap.appendChild(pagBox);

  function draw(){
    const b = filterBar.querySelector("#histBlock").value;
    const s = filterBar.querySelector("#histStatus").value;
    const preset = dateBar.querySelector("#histPreset").value;
    const contactSearchEl = wrap.querySelector("#histContactSearch");
    const contactQ = contactSearchEl ? contactSearchEl.value.trim().toLowerCase() : "";

    let range = null;
    if(preset === "custom"){
      const from = customRange.querySelector("#histFrom").value;
      const to = customRange.querySelector("#histTo").value;
      if(from || to) range = { from: from || "0000-01-01", to: to || "9999-12-31" };
    } else if(preset !== "all"){
      range = dateRangeForPreset(preset);
    }

    let list = sortByNewest(visitors.filter(v=>{
      if(b && v.block!==b) return false;
      if(s && v.status!==s) return false;
      if(range){
        const d = (v.created_at||"").slice(0,10);
        if(d < range.from || d > range.to) return false;
      }
      if(contactQ){
        const haystack = `${v.vehicle_no||""} ${v.phone||""} ${v.visitor_name||""} ${v.block||""}-${v.flat_no||""} ${v.block||""} ${v.flat_no||""}`.toLowerCase();
        if(!haystack.includes(contactQ)) return false;
      }
      return true;
    }));
    if(role==="member" && memberBlock && memberFlat){
      list = list.filter(v=>v.block===memberBlock && v.flat_no===memberFlat);
    }
    listBox.innerHTML = "";
    pagBox.innerHTML = "";
    if(!list.length){ listBox.appendChild(emptyState("No records match.")); return; }
    const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if(histPage > totalPages) histPage = totalPages;
    const pageItems = list.slice((histPage-1)*PAGE_SIZE, histPage*PAGE_SIZE);
    pageItems.forEach(v=> listBox.appendChild(visitCard(v,false,false,true)));
    pagBox.appendChild(buildPaginationControls(histPage, list.length, (p)=>{ histPage = p; draw(); }));
  }

  const resetAndDraw = ()=>{ histPage = 1; draw(); };

  const contactSearchEl = wrap.querySelector("#histContactSearch");
  if(contactSearchEl) contactSearchEl.oninput = resetAndDraw;

  dateBar.querySelector("#histPreset").onchange = ()=>{
    customRange.style.display = dateBar.querySelector("#histPreset").value==="custom" ? "grid" : "none";
    resetAndDraw();
  };
  customRange.querySelector("#histFrom").onchange = resetAndDraw;
  customRange.querySelector("#histTo").onchange = resetAndDraw;
  filterBar.querySelector("#histBlock").onchange = resetAndDraw;
  filterBar.querySelector("#histStatus").onchange = resetAndDraw;
  draw();
  return wrap;
}

const PAGE_SIZE = 10;

function buildPaginationControls(currentPage, totalItems, onChange){
  const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
  const bar = document.createElement("div");
  bar.className = "pagination-bar";
  bar.innerHTML = `
    <button class="pg-btn" id="pgPrev" ${currentPage<=1?"disabled":""}>‹ Prev</button>
    <span class="pg-label">Page ${currentPage} of ${totalPages}</span>
    <button class="pg-btn" id="pgNext" ${currentPage>=totalPages?"disabled":""}>Next ›</button>
  `;
  bar.querySelector("#pgPrev").onclick = ()=>{ if(currentPage>1) onChange(currentPage-1); };
  bar.querySelector("#pgNext").onclick = ()=>{ if(currentPage<totalPages) onChange(currentPage+1); };
  return bar;
}

/* ---------------- Members search (Security / Admin) ---------------- */
function renderMembers(){
  const wrap = document.createElement("div");

  const alertBanner = document.createElement("div");
  wrap.appendChild(alertBanner);

  const searchCard = document.createElement("div");
  searchCard.className = "card";
  searchCard.innerHTML = `
    <div class="section-title">Find flat member</div>
    <div class="field">
      <input id="srQuick" placeholder="Search by flat no. or name (e.g. 204 or Suresh)" autocomplete="off">
    </div>
  `;
  wrap.appendChild(searchCard);

  const listBox = document.createElement("div");
  listBox.className = "card";
  listBox.innerHTML = `<div class="empty">Loading members…</div>`;
  wrap.appendChild(listBox);

  let allMembers = [];
  let loadError = "";

  function buildRow(m){
    const row = document.createElement("div");
    row.className = "member-row";
    const avatarInner = m.photo_url
      ? `<img class="avatar" src="${m.photo_url}">`
      : `<div class="avatar-fallback">${initials(m.member_name)}</div>`;
    const badge = m._pending > 0
      ? `<span class="avatar-badge">${m._pending}</span>`
      : "";
    row.innerHTML = `
      <div class="avatar-wrap">${avatarInner}${badge}</div>
      <div class="member-info">
        <div class="mname">${m.member_name || "Unnamed"}${m._pending > 0 ? ' <span class="new-tag">WAITING</span>' : ""}</div>
        <div class="mmeta">Block ${m.block} · Flat ${m.flat_no}${m.phone ? " · "+m.phone : ""}</div>
      </div>
      ${m.phone ? `<a class="mcall" href="tel:${m.phone}">Call</a>` : ""}
    `;
    if(m._pending > 0) row.style.cssText = "background:#fdf5f3;border-radius:12px;padding:10px 8px;margin:4px -8px;";
    return row;
  }

  function draw(){
    if(loadError){
      listBox.innerHTML = "";
      const err = document.createElement("div");
      err.className = "empty";
      err.style.color = "var(--red)";
      err.textContent = "Couldn't load members: " + loadError;
      listBox.appendChild(err);
      return;
    }
    const q = searchCard.querySelector("#srQuick").value.trim().toLowerCase();

    // attach live pending count to every member
    allMembers.forEach(m=>{
      m._pending = visitors.filter(v=>
        v.status==="pending" && v.block===m.block && v.flat_no===m.flat_no
      ).length;
    });

    const waitingCount = allMembers.filter(m=>m._pending > 0).length;
    alertBanner.innerHTML = waitingCount > 0
      ? `<div class="lic-banner lic-warn" style="margin-bottom:12px;">${waitingCount} flat${waitingCount===1?"":"s"} waiting on visitor approval</div>`
      : "";

    const list = allMembers.filter(m => {
      if(!q) return true;
      const haystack = `${m.block||""} ${m.flat_no||""} ${m.block||""}-${m.flat_no||""} ${m.member_name||""}`.toLowerCase();
      return haystack.includes(q);
    });

    // pending flats always bubble to the top, sorted by most waiting first
    list.sort((a,b)=> b._pending - a._pending);

    listBox.innerHTML = "";
    if(!allMembers.length){
      listBox.appendChild(emptyState("No members added yet. Ask Admin to add flat contacts under Manage Flats."));
      return;
    }
    if(!list.length){
      listBox.appendChild(emptyState("No match for that search."));
      return;
    }

    const waiting = list.filter(m=>m._pending > 0);
    const rest = list.filter(m=>m._pending === 0);

    if(waiting.length){
      const header = document.createElement("div");
      header.className = "section-title";
      header.style.color = "var(--red)";
      header.textContent = "Needs approval";
      listBox.appendChild(header);
      waiting.forEach(m=> listBox.appendChild(buildRow(m)));
      if(rest.length){
        const header2 = document.createElement("div");
        header2.className = "section-title";
        header2.style.marginTop = "14px";
        header2.textContent = "All flats";
        listBox.appendChild(header2);
      }
    }
    rest.forEach(m=> listBox.appendChild(buildRow(m)));
  }
  searchCard.querySelector("#srQuick").oninput = draw;

  // fetch happens after we've already returned real DOM to render()
  tursoExec(`SELECT * FROM flat_members ORDER BY block, flat_no`)
    .then(({rows}) => { allMembers = rows; draw(); })
    .catch(e => { console.error(e); loadError = e.message || String(e); draw(); });

  return wrap;
}

    targets.push({ label, el: secs[i] });
  });

  const layout = document.createElement("div");
  layout.className = "manage-layout";
  const rail = document.createElement("div");
  rail.className = "manage-rail";
  const stickyH = ()=> (document.getElementById("stickyTop")?.offsetHeight || 140);
  const place = ()=>{
    const top = stickyH() + 8;
    rail.style.top = top + "px";
    rail.style.maxHeight = `calc(100vh - ${top + 8}px)`;
    targets.forEach(t=>{ t.el.style.scrollMarginTop = (top + 4) + "px"; });
  };

  const mkBtn = (label, cls, fn)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "rail-btn " + cls;
    b.textContent = label;
    b.onclick = fn;
    return b;
  };
  rail.appendChild(mkBtn("↑ Top", "rail-edge", ()=> window.scrollTo({ top:0, behavior:"smooth" })));
  const railBtns = targets.map(t=>{
    const b = mkBtn(t.label, "", ()=>{
      place();
      t.el.scrollIntoView({ behavior:"smooth", block:"start" });
    });
    rail.appendChild(b);
    return b;
  });
  rail.appendChild(mkBtn("↓ End", "rail-edge", ()=> window.scrollTo({ top: document.documentElement.scrollHeight, behavior:"smooth" })));

  layout.appendChild(rail);
  layout.appendChild(wrap);

  const highlight = ()=>{
    if(!document.body.contains(rail)){
      window.removeEventListener("scroll", highlight);
      window.removeEventListener("resize", place);
      return;
    }
    const line = stickyH() + 24;
    let cur = 0;
    targets.forEach((t,i)=>{ if(t.el.getBoundingClientRect().top <= line) cur = i; });
    if(window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = targets.length - 1;
    railBtns.forEach((b,i)=> b.classList.toggle("active", i === cur));
  };
  window.addEventListener("scroll", highlight, { passive:true });
  window.addEventListener("resize", place);
  place();
  setTimeout(()=>{ place(); highlight(); }, 400);

  return layout;
}

/* ---------------- Visit card ---------------- */
function visitCard(v, showApprove=false, showCheckout=false, showDuration=false){
  const el = document.createElement("div");
  const isFresh = v.status==="pending" && v.created_at && minutesBetween(v.created_at, nowIso()) < 2;
  el.className = "visit-card" + (isFresh ? " fresh" : "");
  const typeInfo = VISITOR_TYPES.find(t=>t.label===v.visitor_type);
  const ic = typeInfo ? typeInfo.ic : "🔔";

  let durationHtml = "";
  if(v.status==="approved" && v.entry_time && !v.exit_time){
    durationHtml = `<div class="meta-line">Inside: <span class="timer" data-entry="${v.entry_time}">…</span> min</div>`;
  } else if(v.exit_time && v.entry_time){
    durationHtml = `<div class="meta-line">Present: <strong>${minutesBetween(v.entry_time, v.exit_time)} min</strong> (In ${v.entry_time.slice(11,16)} · Out ${v.exit_time.slice(11,16)})</div>`;
  }

  let waitHtml = "";
  if(v.status==="pending" && v.created_at){
    waitHtml = `<div class="wait-line"><span class="wait-timer" data-created="${v.created_at}">…</span></div>`;
  }

  const contactLine = (v.phone && (role==="security" || role==="admin"))
    ? `<div class="meta-line">📞 <a href="tel:${v.phone}" style="color:var(--gate-green-dark);font-weight:600;">${v.phone}</a></div>`
    : "";

  const photoThumb = (v.visitor_photo && v.visitor_photo !== "null" && (role==="security" || role==="admin"))
    ? `<img class="avatar" src="${v.visitor_photo}" style="float:right;margin-left:10px;">`
    : "";

  el.innerHTML = `
    ${photoThumb}
    <div class="visit-top">
      <div>
        <div class="visit-name">${ic} ${v.visitor_name || "Visitor"}${isFresh ? ' <span class="new-tag">NEW</span>' : ""}</div>
        <div class="visit-sub">${v.visitor_type} · Block ${v.block}-${v.flat_no}${v.vehicle_no ? " · "+v.vehicle_no : ""}</div>
      </div>
      <span class="badge badge-${v.status}">${v.status.replace("_"," ")}</span>
    </div>
    ${contactLine}
    ${v.purpose ? `<div class="meta-line">${v.purpose}</div>` : ""}
    ${durationHtml}
    ${waitHtml}
    <div class="meta-line">Logged ${formatDateDMY(v.created_at)} ${v.created_at ? v.created_at.slice(11,16) : ""}</div>
  `;

  if(showApprove){
    const row = document.createElement("div");
    row.className = "btn-row";
    const canApprove = role==="member" || role==="admin";
    if(canApprove){
      const a = document.createElement("button");
      a.className = "btn btn-approve";
      a.textContent = "Approve";
      a.onclick = ()=> updateStatus(v.id, "approved", role);
      const r = document.createElement("button");
      r.className = "btn btn-reject";
      r.textContent = "Reject";
      r.onclick = ()=> updateStatus(v.id, "rejected", role);
      row.appendChild(a); row.appendChild(r);
    } else {
      row.innerHTML = `<div class="meta-line">Waiting for member/admin approval…</div>`;
    }
    el.appendChild(row);
  }

  if(showCheckout){
    const row = document.createElement("div");
    row.className = "btn-row";
    const o = document.createElement("button");
    o.className = "btn btn-out";
    o.textContent = "Mark check-out";
    o.onclick = ()=> checkOut(v.id);
    row.appendChild(o);
    el.appendChild(row);
  }

  return el;
}

async function updateStatus(id, status, approver){
  const patch = status==="approved" ? `, entry_time = ?` : "";
  const args = status==="approved" ? [status, approver, nowIso(), id] : [status, approver, id];
  await tursoExec(`UPDATE visitors SET status=?, approved_by=?${patch} WHERE id=?`, args);
  toast(status==="approved" ? "Approved — allow entry" : "Visitor rejected");
  await refreshVisitors();
  renderRoleBar();
  renderTabs();
  render();
}

async function checkOut(id){
  await tursoExec(`UPDATE visitors SET status='checked_out', exit_time=? WHERE id=?`, [nowIso(), id]);
  toast("Check-out recorded");
  await refreshVisitors();
  renderRoleBar();
  renderTabs();
  render();
}

function renderLicenseTab(){
  const wrap = document.createElement("div");
  const statusCard = document.createElement("div");
  statusCard.className = "card";
  let statusHtml = "";
  if(appLicense.status === "trial"){
    statusHtml = `<div class="section-title">Status</div><p>Free trial — <strong>${appLicense.daysLeft} day(s)</strong> left.</p>`;
  } else if(appLicense.status === "licensed"){
    statusHtml = `<div class="section-title">Status</div><p>Licensed — valid until <strong>${formatDateDMY(appLicense.licenseExpiresAt)}</strong>.</p>`;
  } else {

/* ---------------- Number plate reader ---------------- */
/*PLATE-START*/
const STATE_CODES = new Set(["AN","AP","AR","AS","BR","CH","CG","DD","DL","DN","GA","GJ","HP","HR","JH","JK","KA","KL","LA","LD","MH","ML","MN","MP","MZ","NL","OD","OR","PB","PY","RJ","SK","TN","TR","TS","UK","UP","WB"]);
const TO_LETTER = {"0":"O","1":"I","2":"Z","4":"A","5":"S","6":"G","8":"B"};
const TO_DIGIT  = {"O":"0","Q":"0","C":"0","D":"0","I":"1","L":"1","Z":"2","A":"4","S":"5","G":"0","T":"7","B":"8"};

function formatPlateTyped(v){
  const s = (v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  let m = s.match(/^([A-Z]{2})(\d{2})([A-Z]{1,3})(\d{4})$/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}-${m[4]}`;
  m = s.match(/^(\d{2})(BH)(\d{4})([A-Z]{1,2})$/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}-${m[4]}`;
  return (v||"").toUpperCase();
}

// Returns the best Indian plate found in the OCR texts as "KA-05-XX-1234", or null.
function extractPlate(texts){
  let best = null;
  const consider = (raw)=>{
    const s = (raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    for(const sl of [2,1,3]){
      const total = 4 + sl + 4;
      for(let i=0; i+total<=s.length; i++){
        const w = s.substr(i,total).split("");
        let cost = 0;
        const fix = (idx, isLetter)=>{
          const ch = w[idx];
          const ok = isLetter ? /[A-Z]/.test(ch) : /[0-9]/.test(ch);
          if(ok) return;
          const map = isLetter ? TO_LETTER : TO_DIGIT;
          if(map[ch]){ w[idx] = map[ch]; cost++; } else { cost += 5; }
        };
        for(let k=0;k<2;k++) fix(k,true);
        for(let k=2;k<4;k++) fix(k,false);
        for(let k=4;k<4+sl;k++) fix(k,true);
        for(let k=4+sl;k<total;k++) fix(k,false);
        if(cost > 2) continue;
        let st = w[0]+w[1];
        let stateOk = STATE_CODES.has(st);
        if(!stateOk){
          const near = ["KA", ...STATE_CODES].find(c => (c[0]!==st[0]) + (c[1]!==st[1]) <= 1);
          if(near){ st = near; stateOk = true; cost += 2; }
        }
        if(!stateOk || cost > 2) continue;
        const score = 10 - cost*2 + (sl===2 ? 1 : 0) + (st==="KA" ? 0.5 : 0) - i*0.1;
        if(!best || score > best.score){
          best = { score, cost, plate: `${st}-${w[2]}${w[3]}-${w.slice(4,4+sl).join("")}-${w.slice(4+sl).join("")}` };
        }
      }
    }
  };
  texts.forEach(t=>{
    consider(t);
    String(t).split(/\n+/).forEach(consider);
  });
  return best;
}

let ocrWorker = null;
let tesseractLoading = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(!tesseractLoading){
    tesseractLoading = new Promise((resolve, reject)=>{
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload = ()=> resolve(window.Tesseract);
      s.onerror = ()=>{ tesseractLoading = null; reject(new Error("Could not load the reader — check internet")); };
      document.head.appendChild(s);
    });
  }
  return tesseractLoading;
}
async function getOcrWorker(){
  if(ocrWorker) return ocrWorker;
  const T = await loadTesseract();
  ocrWorker = await T.createWorker("eng");
  await ocrWorker.setParameters({ user_defined_dpi: "300" });
  return ocrWorker;
}

function loadImageFromFile(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("Could not open image")); };
    img.src = url;
  });
}

// Keeps only character-shaped dark blobs (drops frame, hologram, stickers, stripes, serial text)
// and groups them into text lines. Returns null when it can't find a plausible plate text.
function filterCharacters(bw, w, h){
  const n = w*h;
  const lab = new Int32Array(n).fill(-1);
  const comps = [];
  const stack = [];
  for(let p=0;p<n;p++){
    if(bw[p] !== 0 || lab[p] >= 0) continue;
    const id = comps.length;
    let minx=w, maxx=0, miny=h, maxy=0, area=0;
    lab[p] = id; stack.push(p);
    while(stack.length){
      const q = stack.pop();
      const x = q % w, y = (q / w) | 0;
      area++;
      if(x<minx) minx=x; if(x>maxx) maxx=x; if(y<miny) miny=y; if(y>maxy) maxy=y;
      for(let dy=-1; dy<=1; dy++){
        const yy = y+dy; if(yy<0 || yy>=h) continue;
        for(let dx=-1; dx<=1; dx++){
          const xx = x+dx; if(xx<0 || xx>=w || (!dx && !dy)) continue;
          const m = yy*w+xx;
          if(bw[m] === 0 && lab[m] < 0){ lab[m] = id; stack.push(m); }
        }
      }
    }
    comps.push({ id, ids:[id], minx, maxx, miny, maxy, area, bw: maxx-minx+1, bh: maxy-miny+1 });
  }
  const cands = comps.filter(c =>
    c.bh >= h*0.06 && c.bh <= h*0.9 && c.bw <= w*0.5 &&
    c.bw / c.bh <= 1.3 && c.bw / c.bh >= 0.1 && c.area >= c.bw*c.bh*0.18);
  if(cands.length < 4) return null;
  const median = (arr)=>{
    // dominant height: the value shared (within 20%) by the most blobs
    let bestH = arr[0], bestN = 0;
    for(const hv of arr){
      const cnt = arr.filter(v => v >= 0.8*hv && v <= 1.2*hv).length;
      if(cnt > bestN || (cnt === bestN && hv > bestH)){ bestN = cnt; bestH = hv; }
    }
    return bestH;
  };
  cands.sort((p,q)=> (p.miny+p.maxy) - (q.miny+q.maxy));
  let groups = [];
  for(const c of cands){
    const cy = (c.miny + c.maxy) / 2;
    const g = groups[groups.length-1];
    if(g && Math.abs(cy - g.cy) < 0.5*g.medH){
      g.items.push(c);
      g.cy = g.items.reduce((s,i)=> s + (i.miny+i.maxy)/2, 0) / g.items.length;
      g.medH = median(g.items.map(i=>i.bh));
    } else groups.push({ items:[c], cy, medH: c.bh });
  }
  groups = groups.map(g=>{
    // glue fragments of one letter together (e.g. a K whose arms separated from its stem)
    const sorted = [...g.items].sort((p,q)=> p.minx - q.minx);
    const merged = [];
    for(const it of sorted){
      const prev = merged[merged.length-1];
      if(prev){
        const gap = it.minx - prev.maxx;
        const ov = Math.min(prev.maxy, it.maxy) - Math.max(prev.miny, it.miny);
        if(gap <= 0.07*g.medH && ov >= 0.4*Math.min(prev.bh, it.bh)){
          prev.minx = Math.min(prev.minx, it.minx); prev.maxx = Math.max(prev.maxx, it.maxx);
          prev.miny = Math.min(prev.miny, it.miny); prev.maxy = Math.max(prev.maxy, it.maxy);
          prev.bw = prev.maxx - prev.minx + 1; prev.bh = prev.maxy - prev.miny + 1;
          prev.ids = prev.ids.concat(it.ids);
          continue;
        }
      }
      merged.push({ ...it, ids: [...it.ids] });
    }
    const medH = median(merged.map(i=>i.bh));
    const items = merged.filter(i => i.bh >= 0.7*medH && i.bh <= 1.4*medH && i.bw / i.bh <= 1.3);
    return { items, medH };
  }).filter(g => g.items.length >= 2);
  if(!groups.length) return null;
  const hMax = Math.max(...groups.map(g=>g.medH));
  groups = groups.filter(g => g.medH >= 0.33*hMax);
  const kept = groups.reduce((s,g)=> s + g.items.length, 0);
  if(kept < 4 || kept > 14) return null;
  const mask = new Uint8Array(n).fill(255);
  const boxes = [];
  let ux0=w, ux1=0, uy0=h, uy1=0;
  const outGroups = groups.map(g=>{
    let gy0=h, gy1=0;
    g.items.forEach(c=>{
      boxes.push({ minx:c.minx, maxx:c.maxx, miny:c.miny, maxy:c.maxy });
      const idset = new Set(c.ids);
      for(let y=c.miny; y<=c.maxy; y++) for(let x=c.minx; x<=c.maxx; x++){
        const q = y*w+x; if(idset.has(lab[q])) mask[q] = 0;
      }
      ux0 = Math.min(ux0, c.minx); ux1 = Math.max(ux1, c.maxx);
      uy0 = Math.min(uy0, c.miny); uy1 = Math.max(uy1, c.maxy);
      gy0 = Math.min(gy0, c.miny); gy1 = Math.max(gy1, c.maxy);
    });
    return { miny: gy0, maxy: gy1 };
  });
  return { mask, groups: outGroups, charH: hMax, count: kept, boxes, box: { x0:ux0, x1:ux1, y0:uy0, y1:uy1 } };
}

// Cleans a region of the photo. Returns a black-on-white image containing only the characters,
// plus one image per text line (two-row plates have two lines).
function makeVariants(img, r, scale){
  const w = Math.max(1, Math.round(r.sw*scale)), h = Math.max(1, Math.round(r.sh*scale));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, r.sx, r.sy, r.sw, r.sh, 0, 0, w, h);
  const id = ctx.getImageData(0, 0, w, h);
  const d = id.data, n = w*h;
  const gray = new Uint8ClampedArray(n);
  let lo = 255, hi = 0;
  for(let i=0;i<n;i++){
    const g = Math.round(0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2]);
    gray[i] = g; if(g<lo) lo=g; if(g>hi) hi=g;
  }
  const range = Math.max(1, hi-lo);
  const hist = new Array(256).fill(0);
  for(let i=0;i<n;i++){ gray[i] = Math.round((gray[i]-lo)*255/range); hist[gray[i]]++; }
  let sum = 0; for(let t=0;t<256;t++) sum += t*hist[t];
  let sumB = 0, wB = 0, maxVar = 0, thr = 128;
  for(let t=0;t<256;t++){
    wB += hist[t]; if(!wB) continue;
    const wF = n - wB; if(!wF) break;
    sumB += t*hist[t];
    const mB = sumB/wB, mF = (sum-sumB)/wF;
    const v = wB*wF*(mB-mF)*(mB-mF);
    if(v > maxVar){ maxVar = v; thr = t; }
  }
  let white = 0; for(let i=0;i<n;i++) if(gray[i] > thr) white++;
  const invert = white < n/2;   // dark plate with light text -> flip so text is dark on light
  let bw = new Uint8Array(n);
  for(let i=0;i<n;i++) bw[i] = ((gray[i] > thr) !== invert) ? 255 : 0;

  const morph = (src, wantDark, rad)=>{
    const tmp = new Uint8Array(n), out = new Uint8Array(n);
    // horizontal pass
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        let hit = false;
        for(let k=-rad;k<=rad && !hit;k++){ const xx = x+k; if(xx>=0 && xx<w && (src[y*w+xx] === 0) === wantDark) hit = true; }
        tmp[y*w+x] = (hit === wantDark) ? 0 : 255;
        if(!wantDark) tmp[y*w+x] = hit ? 255 : 0;
      }
    }
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        let hit = false;
        for(let k=-rad;k<=rad && !hit;k++){ const yy = y+k; if(yy>=0 && yy<h && (tmp[yy*w+x] === 0) === wantDark) hit = true; }
        out[y*w+x] = wantDark ? (hit ? 0 : 255) : (hit ? 255 : 0);
      }
    }
    return out;
  };

  // Remove big dark blobs touching the edge (the plate frame / background); characters are small.
  const seen = new Uint8Array(n);
  const stack = [];
  const trySeed = (p)=>{
    if(bw[p] !== 0 || seen[p]) return;
    const comp = [p]; seen[p] = 1; stack.length = 0; stack.push(p);
    while(stack.length){
      const q = stack.pop();
      const x = q % w, y = (q / w) | 0;
      const nb = [];
      if(x>0) nb.push(q-1); if(x<w-1) nb.push(q+1); if(y>0) nb.push(q-w); if(y<h-1) nb.push(q+w);
      for(const m of nb){ if(bw[m] === 0 && !seen[m]){ seen[m] = 1; comp.push(m); stack.push(m); } }
    }
    if(comp.length > n*0.02) for(const m of comp) bw[m] = 255;
  };
  for(let x=0;x<w;x++){ trySeed(x); trySeed((h-1)*w+x); }
  for(let y=0;y<h;y++){ trySeed(y*w); trySeed(y*w+w-1); }

  const mk = (cw, ch, fn)=>{
    const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
    const cx = cv.getContext("2d"); const o = cx.createImageData(cw, ch);
    for(let y=0;y<ch;y++) for(let x=0;x<cw;x++){
      const v = fn(x,y); const k = (y*cw+x)*4;
      o.data[k]=o.data[k+1]=o.data[k+2]=v; o.data[k+3]=255;
    }
    cx.putImageData(o, 0, 0); return cv;
  };

  let fres = filterCharacters(bw, w, h);
  if(fres){
    // opening (erode then dilate the dark pixels) cuts thin bridges, e.g. a hologram touching a letter
    const rad = Math.max(1, Math.round(fres.charH/30));
    const opened = morph(morph(bw, false, rad), true, rad);
    const f2 = filterCharacters(opened, w, h);
    if(f2 && f2.count > fres.count){
      // use the cut to decide WHICH blobs are characters, but keep their original, undamaged pixels
      const m2 = new Uint8Array(n).fill(255);
      f2.boxes.forEach(b=>{
        for(let y=b.miny; y<=b.maxy; y++) for(let x=b.minx; x<=b.maxx; x++){
          const q = y*w + x; if(bw[q] === 0) m2[q] = 0;
        }
      });
      fres = { ...f2, mask: m2 };
    }
  }
  let use = bw, box = { x0:0, x1:w-1, y0:0, y1:h-1 }, bands = [];
  if(fres){
    use = fres.mask; box = fres.box;
    bands = fres.groups.map(g=>[g.miny, g.maxy]);
  } else {
    const rowDark = new Array(h).fill(0);
    for(let y=0;y<h;y++){ let c2 = 0; for(let x=0;x<w;x++) if(bw[y*w+x] === 0) c2++; rowDark[y] = c2; }
    const minRow = Math.max(2, w*0.004), maxGap = Math.max(3, Math.round(h*0.02));
    let s0 = -1, gap = 0;
    for(let y=0;y<h;y++){
      if(rowDark[y] > minRow){ if(s0 < 0) s0 = y; gap = 0; }
      else if(s0 >= 0){ gap++; if(gap > maxGap){ bands.push([s0, y-gap]); s0 = -1; gap = 0; } }
    }
    if(s0 >= 0) bands.push([s0, h-1]);
    const maxH = Math.max(0, ...bands.map(b=>b[1]-b[0]+1));
    bands = bands.filter(b => (b[1]-b[0]+1) >= maxH*0.45);
  }
  const bh0 = box.y1 - box.y0 + 1;
  const pad = Math.round(bh0*0.12) + 12;
  const bx0 = Math.max(0, box.x0 - Math.round(bh0*0.05)), bx1 = Math.min(w-1, box.x1 + Math.round(bh0*0.05));
  const by0 = Math.max(0, box.y0 - Math.round(bh0*0.05)), by1 = Math.min(h-1, box.y1 + Math.round(bh0*0.05));
  const cw = (bx1-bx0+1) + 2*pad, chh = (by1-by0+1) + 2*pad;
  const bwCanvas = mk(cw, chh, (x,y)=>{
    const sx = x - pad + bx0, sy = y - pad + by0;
    return (sx<0||sx>=w||sy<0||sy>=h) ? 255 : use[sy*w+sx];
  });
  const lineCanvases = bands.map(([y0,y1])=>{
    const m = Math.round((y1-y0+1)*0.2) + 6;
    const ly0 = Math.max(0, y0 - m), ly1 = Math.min(h-1, y1 + m);
    const lh = (ly1-ly0+1) + 2*pad;
    return mk(cw, lh, (x,y)=>{
      const sx = x - pad + bx0, sy = y - pad + ly0;
      if(sx<0 || sx>=w || sy<ly0 || sy>ly1) return 255;
      return use[sy*w+sx];
    });
  });
  return { bwCanvas, lineCanvases, filtered: !!fres };
}

// Finds up to 3 likely plate areas: bright rectangles with dark characters inside.
function findPlateRegions(img){
  const L = 480;
  const s = Math.min(1, L / Math.max(img.width, img.height));
  const w = Math.max(8, Math.round(img.width*s)), h = Math.max(8, Math.round(img.height*s));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const gray = new Uint8Array(w*h);
  let lo = 255, hi = 0;
  for(let i=0;i<w*h;i++){
    const g = (0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2]) | 0;
    gray[i] = g; if(g<lo) lo=g; if(g>hi) hi=g;
  }
  const range = Math.max(1, hi - lo);
  const W1 = w + 1;
  const mkI = ()=> new Int32Array(W1 * (h+1));
  const Ib = mkI(), Id = mkI(), Ie = mkI();   // bright, dark, edge counts
  for(let y=0;y<h;y++){
    let rb = 0, rd = 0, re = 0;
    for(let x=0;x<w;x++){
      const g = (gray[y*w+x] - lo) / range;
      if(g > 0.62) rb++;
      if(g < 0.30) rd++;
      if(x>0 && x<w-1 && Math.abs(gray[y*w+x+1] - gray[y*w+x-1]) / range > 0.18) re++;
      const k = (y+1)*W1 + (x+1), up = y*W1 + (x+1);
      Ib[k] = Ib[up] + rb; Id[k] = Id[up] + rd; Ie[k] = Ie[up] + re;
    }
  }
  const sumI = (I,x,y,ww,hh)=> I[(y+hh)*W1+x+ww] - I[y*W1+x+ww] - I[(y+hh)*W1+x] + I[y*W1+x];
  const shapes = [
    [0.15,2.2],[0.22,2.2],[0.30,2.2],[0.38,2.2],[0.50,2.2],[0.65,2.0],[0.80,1.9],[0.92,1.9],
    [0.15,4.5],[0.22,4.5],[0.32,4.5],[0.45,4.5],[0.60,4.5],[0.80,4.5]
  ];
  let cands = [];
  shapes.forEach(([frac, aspect])=>{
    const ww = Math.round(w*frac), hh = Math.round(ww/aspect);
    if(ww < 24 || hh < 8 || ww > w || hh > h) return;
    const sx = Math.max(2, Math.round(ww/10)), sy = Math.max(2, Math.round(hh/8));
    const area = ww*hh;
    for(let y=0; y+hh<=h; y+=sy){
      for(let x=0; x+ww<=w; x+=sx){
        const fb = sumI(Ib,x,y,ww,hh) / area;
        const fd = sumI(Id,x,y,ww,hh) / area;
        const fe = sumI(Ie,x,y,ww,hh) / area;
        if(fb < 0.40 || fb > 0.88 || fd < 0.04 || fd > 0.40 || fe < 0.05) continue;
        cands.push({ x, y, ww, hh, score: fb * Math.min(fd, 0.25) * Math.min(fe, 0.25) * (0.6 + ww/w) });
      }
    }
  });
  cands.sort((a,b)=> b.score - a.score);
  const picked = [];
  const iou = (a,b)=>{
    const x1 = Math.max(a.x,b.x), y1 = Math.max(a.y,b.y);
    const x2 = Math.min(a.x+a.ww,b.x+b.ww), y2 = Math.min(a.y+a.hh,b.y+b.hh);
    const inter = Math.max(0,x2-x1) * Math.max(0,y2-y1);
    return inter / (a.ww*a.hh + b.ww*b.hh - inter);
  };
  for(const cnd of cands){
    if(picked.length >= 3) break;
    if(picked.every(p => iou(p,cnd) < 0.25)) picked.push(cnd);
  }
  // grow each window outward while the strip beyond its edge is still plate-coloured (bright)
  const strip = (x,y,ww,hh)=> (ww<=0||hh<=0) ? 0 : sumI(Ib,x,y,ww,hh) / (ww*hh);
  picked.forEach(p=>{
    for(let it=0; it<60; it++){
      let moved = false;
      if(p.x >= 2 && strip(p.x-2, p.y, 2, p.hh) >= 0.35){ p.x -= 2; p.ww += 2; moved = true; }
      if(p.x + p.ww + 2 <= w && strip(p.x+p.ww, p.y, 2, p.hh) >= 0.35){ p.ww += 2; moved = true; }
      if(p.y >= 2 && strip(p.x, p.y-2, p.ww, 2) >= 0.35){ p.y -= 2; p.hh += 2; moved = true; }
      if(p.y + p.hh + 2 <= h && strip(p.x, p.y+p.hh, p.ww, 2) >= 0.35){ p.hh += 2; moved = true; }
      if(!moved) break;
    }
  });
  return picked.map(p=>{
    const padX = p.ww*0.05, padY = p.hh*0.08;
    const x0 = Math.max(0, p.x - padX), y0 = Math.max(0, p.y - padY);
    const x1 = Math.min(w, p.x + p.ww + padX), y1 = Math.min(h, p.y + p.hh + padY);
    return { sx: x0/s, sy: y0/s, sw: (x1-x0)/s, sh: (y1-y0)/s };
  });
}

// Runs OCR over regions and votes. A plate is only trusted when several readings agree.
async function scanRegions(img, regions, onStatus){
  const worker = await getOcrWorker();
  const tally = {};
  let raw = "";
  const total = regions.length;
  const read = async (cv, psm)=>{
    await worker.setParameters({ tessedit_pageseg_mode: psm });
    const { data } = await worker.recognize(cv);
    return data.text || "";
  };
  const vote = (txt, weight)=>{
    const cand = extractPlate([txt]);
    if(!cand) return;
    const t = tally[cand.plate] || (tally[cand.plate] = { plate: cand.plate, weight: 0, cost: 9 });
    t.weight += weight;
    t.cost = Math.min(t.cost, cand.cost);
  };
  const best = ()=> Object.values(tally).sort((a,b)=> b.weight-a.weight || a.cost-b.cost)[0] || null;
  const decided = ()=>{
    const arr = Object.values(tally).sort((x,y)=> y.weight-x.weight || x.cost-y.cost);
    return arr[0] && arr[0].weight >= 3 && arr[0].weight - (arr[1] ? arr[1].weight : 0) >= 1.5;
  };
  for(let ri=0; ri<total; ri++){
    const reg = regions[ri];
    onStatus(`Reading plate... (area ${ri+1}/${total})`);
    const base = reg.full ? 0.5 : (reg.manual ? 2 : 1);
    const targets = reg.full ? [null] : (ri === 0 ? [750, 1000, 1300] : [850]);
    for(const tw of targets){
      const scale = reg.full ? Math.min(1, 1600/Math.max(reg.sw, reg.sh)) : Math.min(4, tw/reg.sw);
      const v = makeVariants(img, reg, scale);
      if(reg.full){
        vote(await read(v.bwCanvas, "6"), base);
        continue;
      }
      // a region where no character-like marks were found is almost surely not a plate
      const w0 = v.filtered ? 1 : 0.4;
      const t2 = await read(v.bwCanvas, "6");
      if(t2.replace(/[^A-Za-z0-9]/g,"").length >= 6 && raw.length < 6) raw = t2;
      vote(t2, base * 1.3 * w0);
      if(v.lineCanvases.length > 1){
        let joined = "";
        for(const lc of v.lineCanvases) joined += (await read(lc, "7")) + "\n";
        vote(joined, base * w0);
      } else if(v.lineCanvases.length === 1){
        vote(await read(v.lineCanvases[0], "7"), base * w0);
      }
      if(decided()) break;
    }
    if(decided()) break;
  }
  return { top: best(), raw: raw.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,24) };
}

async function autoReadPlate(img, onStatus){
  onStatus("Locating plate...");
  const whole = { sx:0, sy:0, sw:img.width, sh:img.height };
  const regs = [];
  // close-up photo? if the whole image already shows 4-14 character-shaped marks in lines, try it first
  try{
    const probe = makeVariants(img, whole, Math.min(1, 640/Math.max(img.width, img.height)));
    if(probe.filtered) regs.push({ ...whole });
  }catch(e){ console.error(e); }
  findPlateRegions(img).forEach(r => regs.push({ ...r }));
  regs.push({ ...whole, full:true });
  onStatus("Loading reader (first time needs internet)...");
  return scanRegions(img, regs, onStatus);
}

// Full-screen box-drawing tool so the guard can mark the plate by hand.
function openPlateCropper(img, onRegion){
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(20,28,24,.95);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;";
  const msg = document.createElement("div");
  msg.style.cssText = "color:#fff;font-size:.9rem;text-align:center;";
  msg.textContent = "Drag a box tightly around the number plate";
  const s = Math.min((Math.min(window.innerWidth, 900) - 24) / img.width, (window.innerHeight - 170) / img.height);
  const cv = document.createElement("canvas");
  cv.width = Math.max(10, Math.round(img.width*s)); cv.height = Math.max(10, Math.round(img.height*s));
  cv.style.cssText = "touch-action:none;max-width:100%;border-radius:8px;";
  const ctx = cv.getContext("2d");
  let rect = null, start = null;
  const draw = ()=>{
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    if(rect){
      ctx.strokeStyle = "#ffd54a"; ctx.lineWidth = 3;
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
    }
    okBtn.disabled = !(rect && rect.w > 20 && rect.h > 8);
  };
  const pos = (e)=>{
    const b = cv.getBoundingClientRect();
    return { x: Math.min(cv.width, Math.max(0, (e.clientX-b.left)*cv.width/b.width)),
             y: Math.min(cv.height, Math.max(0, (e.clientY-b.top)*cv.height/b.height)) };
  };
  const btns = document.createElement("div");
  btns.style.cssText = "display:flex;gap:10px;width:100%;max-width:420px;";
  const okBtn = document.createElement("button");
  okBtn.className = "btn btn-primary"; okBtn.textContent = "Read this area"; okBtn.disabled = true;
  const cancel = document.createElement("button");
  cancel.className = "btn"; cancel.textContent = "Cancel";
  cancel.style.cssText = "background:var(--panel);color:var(--ink);";
  btns.appendChild(okBtn); btns.appendChild(cancel);
  cv.addEventListener("pointerdown", e=>{ cv.setPointerCapture(e.pointerId); start = pos(e); rect = { x:start.x, y:start.y, w:0, h:0 }; draw(); });
  cv.addEventListener("pointermove", e=>{
    if(!start) return;
    const p = pos(e);
    rect = { x:Math.min(start.x,p.x), y:Math.min(start.y,p.y), w:Math.abs(p.x-start.x), h:Math.abs(p.y-start.y) };
    draw();
  });
  cv.addEventListener("pointerup", ()=>{ start = null; });
  cancel.onclick = ()=> ov.remove();
  okBtn.onclick = ()=>{
    const r = { sx: rect.x/s, sy: rect.y/s, sw: rect.w/s, sh: rect.h/s, manual:true };
    ov.remove();
    onRegion(r);
  };
  ov.appendChild(msg); ov.appendChild(cv); ov.appendChild(btns);
  document.body.appendChild(ov);
  draw();
}

function setupPlateScan(card){
  const camBtn = card.querySelector("#plateCamBtn");
  if(!camBtn) return;
  const upBtn = card.querySelector("#plateUpBtn");
  const camIn = card.querySelector("#plateCamInput");
  const upIn = card.querySelector("#plateUpInput");
  const status = card.querySelector("#plateStatus");
  const vehEl = card.querySelector("#f_vehicle");
  const setBusy = (b)=>{ camBtn.disabled = upBtn.disabled = b; };
  camBtn.onclick = ()=> camIn.click();
  upBtn.onclick = ()=> upIn.click();

  const fill = (plate)=>{
    vehEl.value = plate;
    status.textContent = `Detected: ${plate} - please confirm it matches the vehicle.`;
    toast("Vehicle number filled");
  };
  const showFailure = (img, res)=>{
    status.innerHTML = "";
    const top = res && res.top;
    const line = document.createElement("div");
    line.textContent = top
      ? `Not confident. Possible plate: ${top.plate}${res.raw ? " (reader saw: " + res.raw + ")" : ""}.`
      : `Couldn't read the plate${res && res.raw ? " (reader saw: " + res.raw + ")" : ""}.`;
    status.appendChild(line);
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;";
    if(top){
      const use = document.createElement("button");
      use.type = "button"; use.className = "mcall"; use.textContent = "Use this";
      use.onclick = ()=> fill(top.plate);
      row.appendChild(use);
    }
    const man = document.createElement("button");
    man.type = "button"; man.className = "mcall"; man.textContent = "Select plate area";
    man.onclick = ()=> openPlateCropper(img, async (region)=>{
      setBusy(true);
      try{
        status.textContent = "Reading selected area...";
        const r2 = await scanRegions(img, [region], m=>{ status.textContent = m; });
        if(r2.top) fill(r2.top.plate);
        else showFailure(img, r2);
      }catch(err){ console.error(err); status.textContent = "Scan failed: " + (err.message||err); }
      finally{ setBusy(false); }
    });
    row.appendChild(man);
    status.appendChild(row);
  };

  const handle = async (e)=>{
    const file = e.target.files[0];
    e.target.value = "";
    if(!file) return;
    setBusy(true);
    try{
      status.textContent = "Preparing image...";
      const img = await loadImageFromFile(file);
      const res = await autoReadPlate(img, m=>{ status.textContent = m; });
      if(res.top && res.top.weight >= 1.25) fill(res.top.plate);
      else showFailure(img, res);
    }catch(err){
      console.error(err);
      status.textContent = "Scan failed: " + (err.message || err);
    }finally{
      setBusy(false);
    }
  };
  camIn.addEventListener("change", handle);
  upIn.addEventListener("change", handle);
}

function emptyState(msg){
  const d = document.createElement("div");
  d.className = "empty";
  d.textContent = msg;
  return d;
}

/* live minute counters for "inside now" cards + pending wait warnings + header clock */
const WEEKDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
setInterval(()=>{
  const clock = document.getElementById("liveClock");
  if(clock){
    const d = new Date();
    const dateStr = `${WEEKDAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    let h = d.getHours();
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if(h === 0) h = 12;
    const timeStr = `${h}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())} ${ampm}`;
    clock.innerHTML = `<div>${dateStr}</div><div class="lc-time">${timeStr}</div>`;
  }
  document.querySelectorAll(".timer").forEach(t=>{
    const entry = t.getAttribute("data-entry");
    if(entry) t.textContent = minutesBetween(entry, nowIso());
  });
  document.querySelectorAll(".wait-timer").forEach(t=>{
    const created = t.getAttribute("data-created");
    if(!created) return;
    const mins = minutesBetween(created, nowIso());
    const card = t.closest(".visit-card");
    if(mins >= 10){
      t.textContent = `Waiting ${mins} min — no response yet`;
      t.className = "wait-timer wait-warn";
      if(card) card.classList.add("overdue");
    } else {
      t.textContent = `Waiting ${mins} min`;
      t.className = "wait-timer wait-ok";
      if(card) card.classList.remove("overdue");
    }
  });
}, 1000);

boot();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

</script>
